name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Workbench unit tests
        run: npm test
      - name: OAuth unit tests
        working-directory: oauth
        run: |
          npm ci
          npm test
